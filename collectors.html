<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collectors - Digital Equb</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:#f3f6f4;margin:0;padding:16px}
    .wrap{max-width:900px;margin:0 auto}
    .card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:14px}
    h1{margin:0;font-size:20px;color:#1b5e20}h3{margin:0 0 8px}
    .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
    .nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:13px}.nav a{color:#2e7d32}
    label{display:block;margin:10px 0 4px;font-size:14px}
    input,select{width:100%;padding:11px;font-size:16px;border:1px solid #ccc;border-radius:8px;background:#fff}
    button{padding:10px 14px;font-size:14px;border:0;border-radius:8px;background:#2e7d32;color:#fff}
    button.gray{background:#757575}button.small{padding:7px 10px;font-size:13px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:600px){.grid{grid-template-columns:1fr}}
    #msg{margin-top:10px;padding:10px;border-radius:8px;font-size:14px;display:none}
    .err{background:#fdecea;color:#b71c1c}.okm{background:#e8f5e9;color:#1b5e20}
    .c{border-bottom:1px solid #eee;padding:12px 0}.c:last-child{border-bottom:0}
    .sub{font-size:13px;color:#666}
    .tag{font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;margin-left:6px}
    .tag.ACTIVE{background:#2e7d32}.tag.SUSPENDED{background:#e65100}.tag.INACTIVE{background:#9e9e9e}
    .actions{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
  </style>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top"><h1>Collectors</h1><button class="gray small" id="logout" type="button">Log out</button></div>
    <div id="admin" class="sub"></div>
    <div class="nav">
      <a href="members.html">Members</a><a href="equb.html">Equb Groups</a>
      <a href="collectors.html">Collectors</a><a href="correction-requests.html">Correction Requests</a>
    </div>
  </div>

  <div class="card">
    <h3 id="formTitle">Add collector</h3>
    <div class="grid">
      <div><label for="name">Full name</label><input id="name" type="text"></div>
      <div><label for="phone">Phone</label><input id="phone" type="tel" inputmode="tel" placeholder="0911000000"></div>
      <div><label for="pin" id="pinLabel">PIN (4 to 6 digits)</label><input id="pin" type="password" inputmode="numeric" autocomplete="new-password"></div>
      <div><label for="limit">Daily cash limit (ETB, 0 = none)</label><input id="limit" type="number" inputmode="decimal" min="0" step="0.01"></div>
      <div><label for="collateral">Required collateral (ETB, optional)</label><input id="collateral" type="number" inputmode="decimal" min="0" step="0.01"></div>
      <div><label for="status">Status</label>
        <select id="status"><option>ACTIVE</option><option>SUSPENDED</option><option>INACTIVE</option></select></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button id="saveBtn" type="button">Save collector</button>
      <button id="cancelBtn" class="gray" type="button" style="display:none">Cancel edit</button>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card"><div id="list"></div></div>
</div>

<script src="equb-core.js"></script>
  <script src="admin-nav.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var admin = equbGetAdminSession();
  if (!admin) { window.location.href = "admin-login.html"; }
  var editingId = null;
  $("admin").textContent = admin ? "Logged in as " + admin.adminName : "";
  $("logout").addEventListener("click", function () { localStorage.removeItem(EQUB_KEYS.adminSession); window.location.href = "admin-login.html"; });

  function show(t, good) { $("msg").textContent = t; $("msg").className = good ? "okm" : "err"; $("msg").style.display = "block"; }
  function cleanPhone(p) { return String(p).replace(/[\s\-()]/g, ""); }
  function validPhone(p) { return /^(\+251|0)[79]\d{8}$/.test(p); }
  function normPhone(p) { return p.indexOf("+251") === 0 ? "0" + p.slice(4) : p; }
  function requireAdmin() {
    admin = equbGetAdminSession();
    if (!admin) { window.location.href = "admin-login.html"; return null; }
    return admin;
  }

  function resetForm() {
    editingId = null;
    ["name", "phone", "pin", "limit", "collateral"].forEach(function (i) { $(i).value = ""; });
    $("status").value = "ACTIVE";
    $("pinLabel").textContent = "PIN (4 to 6 digits)";
    $("formTitle").textContent = "Add collector"; $("cancelBtn").style.display = "none";
  }

  function save() {
    if (!requireAdmin()) return;
    var name = $("name").value.trim().replace(/\s+/g, " ");
    var phone = cleanPhone($("phone").value);
    var pin = $("pin").value.trim();
    var limit = $("limit").value === "" ? 0 : equbMoney($("limit").value);
    var coll = $("collateral").value === "" ? 0 : equbMoney($("collateral").value);
    var status = $("status").value;

    if (name.length < 2) return show("Enter the collector's full name.", false);
    if (!validPhone(phone)) return show("Enter a valid phone, e.g. 0922000000.", false);
    phone = normPhone(phone);
    if (!(limit >= 0) || !(coll >= 0)) return show("Limit and collateral cannot be negative.", false);
    if (["ACTIVE", "SUSPENDED", "INACTIVE"].indexOf(status) === -1) return show("Choose a valid status.", false);
    if ((!editingId || pin) && !/^\d{4,6}$/.test(pin)) return show("PIN must be 4 to 6 digits.", false);

    var cols = equbLoad(EQUB_KEYS.collectors, []);
    var dup = cols.find(function (c) { return c.id !== editingId && normPhone(cleanPhone(c.phone || "")) === phone; });
    if (dup) return show("Phone already used by " + dup.name + " (" + dup.id + ").", false);

    if (editingId) {
      var c = cols.find(function (x) { return x.id === editingId; });
      if (!c) return show("Collector not found.", false);
      c.name = name; c.phone = phone; c.dailyCashLimit = limit; c.collateral = coll; c.status = status;
      if (pin) { c.pin = pin; if (c.password !== undefined) delete c.password; }
      c.updatedAt = new Date().toISOString();
      if (!equbSave(EQUB_KEYS.collectors, cols)) return show("Could not save.", false);
      resetForm(); show("Collector updated.", true);
    } else {
      var id = equbUid("COL");
      cols.push({ id: id, name: name, phone: phone, pin: pin, status: status,
        dailyCashLimit: limit, collateral: coll, createdAt: new Date().toISOString() });
      if (!equbSave(EQUB_KEYS.collectors, cols)) return show("Could not save.", false);
      resetForm(); show("Collector " + id + " created. Login with the ID or phone and the PIN.", true);
    }
    render();
  }

  function setStatus(id, status) {
    if (!requireAdmin()) return;
    if (status !== "ACTIVE" && !confirm("Set this collector to " + status + "? They cannot record new payments.")) return;
    var cols = equbLoad(EQUB_KEYS.collectors, []);
    var c = cols.find(function (x) { return x.id === id; });
    if (!c) return;
    c.status = status; c.updatedAt = new Date().toISOString();
    equbSave(EQUB_KEYS.collectors, cols); render();
  }

  function edit(id) {
    var c = equbLoad(EQUB_KEYS.collectors, []).find(function (x) { return x.id === id; });
    if (!c) return;
    editingId = id;
    $("name").value = c.name || ""; $("phone").value = c.phone || ""; $("pin").value = "";
    $("limit").value = c.dailyCashLimit || 0; $("collateral").value = c.collateral || 0;
    $("status").value = c.status || "ACTIVE";
    $("pinLabel").textContent = "New PIN (leave empty to keep the current one)";
    $("formTitle").textContent = "Edit collector " + id; $("cancelBtn").style.display = "inline-block";
    window.scrollTo(0, 0);
  }

  function render() {
    var cols = equbLoad(EQUB_KEYS.collectors, []);
    var list = $("list"); list.innerHTML = "";
    if (!cols.length) { list.innerHTML = '<div class="sub">No collectors yet.</div>'; return; }
    cols.forEach(function (c) {
      var st = c.status || "ACTIVE";
      var d = document.createElement("div"); d.className = "c";
      d.innerHTML = '<div><b class="n"></b><span class="tag ' + st + '">' + st + '</span></div><div class="sub l1"></div><div class="sub l2"></div><div class="actions"></div>';
      d.querySelector(".n").textContent = c.name;
      d.querySelector(".l1").textContent = c.id + " | " + (c.phone || "no phone");
      d.querySelector(".l2").textContent = "Daily cash limit: " + (c.dailyCashLimit > 0 ? equbFormat(c.dailyCashLimit) : "none") +
        " | Collateral: " + equbFormat(c.collateral || 0) + " | Cash in hand: " + equbFormat(equbCashInHand(c.id));
      var a = d.querySelector(".actions");
      function btn(t, cls, fn) { var b = document.createElement("button"); b.className = "small " + cls; b.textContent = t; b.addEventListener("click", fn); a.appendChild(b); }
      btn("Edit", "", function () { edit(c.id); });
      if (st !== "ACTIVE") btn("Activate", "", function () { setStatus(c.id, "ACTIVE"); });
      if (st === "ACTIVE") btn("Suspend", "gray", function () { setStatus(c.id, "SUSPENDED"); });
      if (st !== "INACTIVE") btn("Deactivate", "gray", function () { setStatus(c.id, "INACTIVE"); });
      list.appendChild(d);
    });
  }

  $("saveBtn").addEventListener("click", save);
  $("cancelBtn").addEventListener("click", resetForm);
  if (admin) { resetForm(); render(); }
</script>
</body>
</html>
